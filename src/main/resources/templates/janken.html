<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>Janken GAME!</title>
</head>

<body>
  <h1>Janken GAME!</h1>
  <h2>エントリー</h2>
  <ul>
    <li th:each="user: ${users}">
      <a th:href="@{/match(id=${user.id})}">[[${user.name}]]</a>
    </li>
  </ul>
  <p>Hi <span sec:authentication="name"></span></p>
  <a href="/logout">ログアウト</a>
</body>

</html>
