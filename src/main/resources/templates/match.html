<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Match</title>
</head>
<body>
  <h1>Match</h1>
  <h2>[[${loginUser}]] V.S. [[${cpu.name}]]</h2>

  <div th:if="${myHand == null}">
    <a th:href="@{/wait(id=${cpu.id}, hand='Gu')}">ぐー</a>
    <a th:href="@{/wait(id=${cpu.id}, hand='Choki')}">ちょき</a>
    <a th:href="@{/wait(id=${cpu.id}, hand='Pa')}">ぱー</a>
  </div>

  <br>
  <a href="/janken">もどる</a>
</body>
</html>
