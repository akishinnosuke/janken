<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Janken GAME</title>
</head>

<body>
  <!-- ログアウト用リンク -->
  <a href="/logout">ログアウト</a>

  <h1>Janken GAME!</h1>

  <div>
    <a href="/janken?hand=Gu">ぐー</a>
    <a href="/janken?hand=Choki">ちょき</a>
    <a href="/janken?hand=Pa">ぱー</a>
  </div>

  <!-- じゃんけん結果表示（手が選ばれている場合） -->
  <div th:if="${myHand}">
    <p th:text="'あなたの手: ' + ${myHand}"></p>
    <p th:text="'相手の手: ' + ${cpuHand}"></p>
    <p th:text="'結果: ' + ${result}"></p>
  </div>

  <div th:if="${janken}">
    <div>あなたの手 [[${janken.myHand}]]</div>
    <div>相手の手 [[${janken.cpuHand}]]</div>
    <div>結果 [[${janken.result}]]</div>
  </div>
</body>

</html>
